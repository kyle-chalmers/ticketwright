# stack.yaml — the tool registry + project facts + policies (single source of truth).
#
# This is a WORKED EXAMPLE for a fictional "Acme" data team (Jira / Snowflake / Slack /
# Google Drive / GitHub). Replace the values with your own, or run `/setup`
# to generate this file by detecting your tooling and interviewing you.
# Field docs: stack.schema.md  ·  Validate: bash bin/verify_stack.sh .claude/config/stack.yaml
# Six more examples live alongside this file: stack.example.asana-bq.yaml (Asana/BigQuery/Teams/
# SharePoint/GitLab), stack.example.azure.yaml (Azure DevOps/Synapse/Teams/SharePoint/Azure Repos),
# stack.example.multi-warehouse.yaml (two warehouse targets in one seam),
# stack.example.multi-audience.yaml (internal vs client delivery — two chat tools and two
# docstores in one repo, routed by a declared audience),
# stack.example.solo.yaml (no tracker at all — tracker: local + id_mode: slug), and
# stack.example.no-warehouse.yaml (no warehouse seam — document/report deliverables).

project:
  key_prefix: ENG                       # ticket-ID prefix; branch names = {key_prefix}-NNNN
  key_prefixes: [ENG]                   # prefixes the ticket index recognizes (defaults to [key_prefix])
  assignee_dir: alice                   # default owner subdir under tickets/
  ticket_path: "tickets/{assignee}/{id}"
  ticket_subdirs: [source_materials, final_deliverables, qc_queries, exploratory_analysis]
  default_epic: ENG-100                 # parent epic for new tickets (or null if the tracker has no epics)
  terminal_status: Done                 # the workflow's "done" state (not always "Done")
  ticket_url_template: "https://acme.atlassian.net/browse/{id}"  # how INDEX.md links a ticket ({id} token); omit/null = no link
  # intake: [tracker]                   # where work arrives (tracker | email | chat); email/chat intake = forwarded threads in source_materials/
  # role: generalist                    # persona for the rendered AGENTS.md (generalist | analyst | engineer | scientist)
  # domain: data analysis               # short phrase for the {{domain}} token in AGENTS.md — any kind of analysis work
  # analysis_tools: []                  # what the team analyzes WITH (e.g. [notebooks, spreadsheets]) — descriptive context rendered into AGENTS.md; not a tool slot, nothing verifies or executes it
  word_limits: {tracker_comment: 100, chat: 100, pr: 200, ticket: 200}
  graph_notes: true                     # Obsidian graph layer (tickets/graph + tickets/objects); false to disable
  graph_config: true                    # also write .obsidian/graph.json (tickets↔objects filter + colors); create/merge-only, never clobbers manual tweaks
  # voice_profiles:                     # per-person comms voice (off unless set). Build with /setup --voice; docs in stack.schema.md
  #   path: "voices/{profile_id}.md"    # where each person's profile lives ({profile_id} token)
  #   map:                              # explicit local identity → profile_id (git email / git name / $USER); a miss fails open
  #     "alice@acme.example": alice
  #     "Alice Smith": alice

seams:
  tracker:
    tool: jira
    adapter: adapters/tracker/jira.md
    transport: both
    site: acme.atlassian.net
    cli: acli
    mcp: atlassian
    verify: 'acli jira workitem search --jql "project = {key_prefix}" --limit 1'

  warehouse:
    tool: snowflake
    adapter: adapters/warehouse/snowflake.md
    transport: both
    cli: snow
    default_warehouse: ANALYTICS_WH
    pii_role: PII_READER
    dev_db: ANALYTICS_DEV
    verify: "snow connection test"

  chat:
    tool: slack
    adapter: adapters/chat/slack.md
    transport: mcp
    mcp: slack
    default_channel: C0XXXXXXXXX         # your channel's ID
    default_mode: draft
    always_include: [Alice]              # FIXED stakeholder list always added to a chat message (never solo-DM a stakeholder)
    # include_self: false                # also @-mention the shipper (resolve_user.py), IN ADDITION to always_include
    verify: null                         # MCP-only: skills check reachability via an MCP call, not the shell

  docstore:
    tool: gdrive
    adapter: adapters/docstore/gdrive.md
    transport: cli
    drive_folder: "Shared drives/Tickets"   # WHICH destination — a team decision (tier 1).
                                            # WHERE it is mounted is per-machine: set `mount_root`
                                            # in .claude/config/connections.local.yaml. The resolver
                                            # composes {base_path} from the two.
    verify: "test -d \"{base_path}\""

  vcs:
    tool: github
    adapter: adapters/vcs/github.md
    transport: cli
    default_branch: main
    semantic_pr: true
    worktree_root: ".claude/worktrees"
    verify: "gh auth status"

policies:
  hard_halt_before_external_posts: true
  db_write_requires_approval: high_risk   # off | high_risk | all — see stack.schema.md
  human_review_handoff: review            # off | review | all — WHERE a human eyeballs deliverables
                                          # in their own apps. WHICH apps is per-user + gitignored:
                                          # see .claude/config/viewer.example.yaml
  chat_default_draft: true
  hyperlink_everything: true
  skillify_everything: true
  reduce_assumptions: true
  commit_plan_before_implement: true
  system_evolution: true
  deterministic_outputs: true
