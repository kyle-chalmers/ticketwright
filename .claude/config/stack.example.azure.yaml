# stack.example.azure.yaml — ABSTRACTION PROOF (hypothetical Microsoft-stack repo).
# Azure DevOps (Boards) + Synapse + Teams + SharePoint + Azure Repos — the SAME skills and SAME
# verb contract as the Jira/Snowflake and Asana/BigQuery examples. Only this file + adapters change.
# Try it: bash bin/verify_stack.sh .claude/config/stack.example.azure.yaml --dry-run

project:
  key_prefix: ENG                       # branch/index display convention (ADO ids are bare integers)
  key_prefixes: [ENG]
  assignee_dir: dana
  ticket_path: "tickets/{assignee}/{id}"
  ticket_subdirs: [source_materials, final_deliverables, qc_queries, exploratory_analysis]
  default_epic: 12                      # Azure Boards work-item id (integer) for the parent epic
  terminal_status: Closed               # Agile process "done" state
  ticket_url_template: "https://dev.azure.com/acme-corp/Platform/_workitems/edit/{number}"  # ADO ids are integers → use {number}, not {id}
  word_limits: {tracker_comment: 100, chat: 100, pr: 200, ticket: 200}
  # voice_profiles:                     # per-person comms voice (off unless set). Build with /setup --voice
  #   path: "voices/{profile_id}.md"
  #   map:
  #     "dana@acme-corp.example": dana

seams:
  tracker:
    tool: azure-devops
    adapter: adapters/tracker/azure-devops.md
    transport: cli
    org: acme-corp
    project: Platform
    done_state: Closed
    verify: "az devops project show --project {project}"

  warehouse:
    tool: synapse
    adapter: adapters/warehouse/synapse.md
    transport: cli
    server: acme-synapse-ondemand.sql.azuresynapse.net
    database: analytics
    dev_schema: dev
    verify: "sqlcmd -S {server} -d {database} -G --authentication-method ActiveDirectoryDefault -Q \"SELECT 1\""

  # A multi-target chat slot: Teams inside the org, email (Outlook) out to stakeholders. Which one
  # a ticket uses comes from its delivery-plan.yaml `audience:` declaration — never a guess, never
  # a fallback (bin/delivery_plan.py; the routing rules live in adapters/README.md § The delivery
  # plan). Each target declares its OWN audience, destination and always_include.
  chat:
    default: internal                   # STRUCTURAL only (pre-routing readers display it); routing never reads it
    targets:
      internal:
        audience: internal              # the routing key a ticket declares
        tool: teams
        adapter: adapters/chat/teams.md
        transport: mcp
        mcp: teams                      # your Teams MCP server name (adapter calls resolve as mcp__{mcp}__…)
        channel: "Data Platform / General"   # Teams' destination key (channel_key: channel)
        default_mode: draft
        always_include: [Dana]          # fixed stakeholder list (never a self-tag)
        # include_self: false           # also mention the shipper, in addition to always_include
        verify: null
      # Email is a CHAT TARGET, not a sixth tool slot — the activated form of the commented
      # `seams.chat.targets.email` block the setup interview writes on an email-out answer.
      # An email cannot be unsent, so `default_mode: draft` is set EXPLICITLY on every email
      # target: an unset default_mode is not documented as meaning draft.
      email:
        audience: stakeholders          # a ticket declaring `audience: stakeholders` routes HERE
        tool: outlook
        adapter: adapters/chat/outlook.md
        transport: mcp
        mcp: outlook
        identity: platform-reports@acme-corp.example   # mail goes out AS this shared mailbox (team decision)
        to: platform-updates@acme-corp.example         # the email adapters' destination key (channel_key: to) — ONE address
        always_include: [dana@acme-corp.example]       # THIS target's own list, applied AFTER routing (rendered as Cc)
        default_mode: draft
        verify: null

  docstore:
    tool: sharepoint
    adapter: adapters/docstore/sharepoint.md
    transport: cli
    drive_folder: "Data Tickets"            # team decision; the OneDrive mount root is per-machine (tier 3)
    verify: "test -d \"{base_path}\""

  vcs:
    tool: azure-repos
    adapter: adapters/vcs/azure-repos.md
    transport: cli
    org: acme-corp
    project: Platform
    repo: analytics
    default_branch: main
    semantic_pr: true
    worktree_root: ".worktrees"
    verify: "az repos list --project {project} --query \"[].name\""

policies:
  hard_halt_before_external_posts: true
  db_write_requires_approval: high_risk   # off | high_risk | all — see stack.schema.md
  chat_default_draft: true
  hyperlink_everything: true
  skillify_everything: true
  reduce_assumptions: true
  commit_plan_before_implement: true
  system_evolution: true
  deterministic_outputs: true
