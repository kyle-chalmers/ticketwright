<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticketwright social preview</title>
<!-- Rendered at 1280x640 by render_social.py. KC AI Labs palette. Fonts fall back to the system
     sans stack when Google Fonts is unreachable. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --lime: #c4ff00; --orange: #e47d5b; --cream: #f5f5f5; --muted: #b8b8b8; --bg: #030303; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--cream);
    font-family: "Space Grotesk", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 420px at 50% 40%, rgba(196, 255, 0, 0.10), transparent 70%),
      radial-gradient(600px 300px at 92% 112%, rgba(228, 125, 91, 0.16), transparent 70%);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(245, 245, 245, 0.08) 1.2px, transparent 1.3px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 78%);
  }
  main {
    position: relative; height: 100%; box-sizing: border-box; padding-bottom: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
  }
  .logo { height: 96px; }
  h1 {
    margin: 0; max-width: 1080px; text-align: center;
    font-size: 48px; line-height: 1.18; font-weight: 600; letter-spacing: -0.02em;
  }
  h1 em { font-style: normal; color: var(--lime); }
  .steps { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 500; color: var(--muted); }
  .steps .sep { color: rgba(184, 184, 184, 0.45); }
  .steps .last { color: var(--cream); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); margin-left: 4px; }
  .by { position: absolute; bottom: 28px; right: 40px; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .by b { color: var(--lime); font-weight: 600; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="dots"></div>
  <main>
    <img class="logo" src="../../docs/images/logo-dark.svg" alt="Ticketwright">
    <h1>High-volume analysis that keeps its quality,<br>with <em>Claude Code</em> on the tools you already use.</h1>
    <div class="steps">
      <span>Open</span><span class="sep">·</span>
      <span>Build</span><span class="sep">·</span>
      <span>Review</span><span class="sep">·</span>
      <span class="last">Ship</span><span class="dot"></span>
    </div>
  </main>
  <div class="by">A <b>KC AI Labs</b> project</div>
</body>
</html>
