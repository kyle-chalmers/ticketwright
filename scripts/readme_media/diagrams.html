<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticketwright README diagrams</title>
<!-- Rendered by render_diagrams.py: each <svg class="diagram"> becomes docs/images/<id>.png at 2x.
     KC AI Labs palette: lime is the kit, orange is only what a person does or approves. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg.diagram { display: block; margin-bottom: 40px; }
  svg text { font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif; }
  .bg { fill: #030303; }
  .grid { fill: url(#dots); }
  .card { fill: #0a0a0a; stroke: #303030; stroke-width: 1.5; }
  .brain { fill: #141414; stroke: #c4ff00; stroke-width: 2; }
  .kicker { fill: #b8b8b8; font-size: 15px; font-weight: 500; letter-spacing: .02em; }
  .h { fill: #f5f5f5; font-size: 19px; font-weight: 600; }
  .lime { fill: #c4ff00; }
  .cmd { fill: #c4ff00; font-family: "JetBrains Mono", Menlo, monospace; font-size: 15px; font-weight: 600; }
  .mono { fill: #f5f5f5; font-family: "JetBrains Mono", Menlo, monospace; font-size: 13px; }
  .body { fill: #b8b8b8; font-size: 14px; }
  .num { fill: #030303; font-size: 15px; font-weight: 700; }
  .flow { stroke: #c4ff00; stroke-width: 2.5; fill: none; }
  .loop { stroke: #c4ff00; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; }
  .label { fill: #f5f5f5; font-size: 14px; font-weight: 500; }
  .you { fill: rgba(228, 125, 91, .12); stroke: #e47d5b; stroke-width: 1.5; }
  .youtext { fill: #e47d5b; font-size: 13.5px; font-weight: 600; }
  .guard { fill: #0a0a0a; stroke: #c4ff00; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .chip { fill: #141414; stroke: #303030; stroke-width: 1; }
  .chiph { fill: #c4ff00; font-size: 13.5px; font-weight: 600; }
  .chipt { fill: #f5f5f5; font-size: 13px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#f5f5f5" fill-opacity=".07"/>
    </pattern>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c4ff00"/>
    </marker>
  </defs>
</svg>

<!-- ============ banner.png: the README hero, readable on light and dark pages ============ -->
<svg id="banner" class="diagram" xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <radialGradient id="bannerglow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#c4ff00" stop-opacity=".13"/>
      <stop offset="1" stop-color="#c4ff00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bannerwarm" cx="96%" cy="118%" r="45%">
      <stop offset="0" stop-color="#e47d5b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e47d5b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect class="bg" width="1200" height="330" rx="22"/>
  <rect class="grid" width="1200" height="330" rx="22"/>
  <rect width="1200" height="330" rx="22" fill="url(#bannerglow)"/>
  <rect width="1200" height="330" rx="22" fill="url(#bannerwarm)"/>
  <image href="../../docs/images/logo-dark.svg" x="390" y="66" width="420" height="72"/>
  <text x="600" y="200" text-anchor="middle" style="font-size:34px;font-weight:600;fill:#f5f5f5;letter-spacing:-.01em">The <tspan fill="#c4ff00">Claude Code</tspan> plugin for ticket-driven analysis</text>
  <text x="600" y="246" text-anchor="middle" style="font-size:19px;fill:#b8b8b8">Prior work recalled  ·  every result reviewed  ·  nothing sent without your go-ahead</text>
  <text x="1160" y="304" text-anchor="end" style="font-size:13px;letter-spacing:.08em;fill:#b8b8b8">A <tspan fill="#c4ff00" font-weight="600">KC AI LABS</tspan> PROJECT</text>
</svg>

<!-- ============ lifecycle.png ============ -->
<svg id="lifecycle" class="diagram" xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect class="bg" width="1200" height="600"/>
  <rect class="grid" width="1200" height="600"/>
  <text class="kicker" x="40" y="52">EVERY TICKET, THE SAME FIVE PHASES. EACH SHIPPED TICKET FEEDS THE NEXT.</text>
  <image href="../../docs/images/logo-dark.svg" x="984" y="30" width="176" height="30"/>

  <!-- team brain -->
  <rect class="brain" x="36" y="130" width="176" height="210" rx="14"/>
  <text class="h lime" x="56" y="170">Team brain</text>
  <text class="mono" x="56" y="205">tickets/</text>
  <text class="mono" x="56" y="227">INDEX.md</text>
  <text class="mono" x="56" y="249">OBJECTS.md</text>
  <text class="body" x="56" y="287">every past ticket,</text>
  <text class="body" x="56" y="307">searchable by</text>
  <text class="body" x="56" y="327">people and agents</text>

  <!-- brain -> phase 1 -->
  <path class="flow" d="M214 235H294" marker-end="url(#head)"/>
  <text class="label" x="254" y="208" text-anchor="middle" style="font-size:13px">closest</text>
  <text class="label" x="254" y="224" text-anchor="middle" style="font-size:13px">prior work</text>

  <!-- five phases -->
  <g>
    <rect class="card" x="300" y="130" width="160" height="210" rx="12"/>
    <circle class="lime" cx="326" cy="158" r="14"/><text class="num" x="326" y="163.5" text-anchor="middle">1</text>
    <text class="h" x="318" y="205">Open the work</text>
    <text class="cmd" x="318" y="232">/ticket</text>
    <text class="body" x="318" y="268">loads the context</text>
    <text class="body" x="318" y="288">and prior work,</text>
    <text class="body" x="318" y="308">writes the plan</text>
  </g>
  <path class="flow" d="M462 235H478" marker-end="url(#head)"/>
  <g>
    <rect class="card" x="482" y="130" width="160" height="210" rx="12"/>
    <circle class="lime" cx="508" cy="158" r="14"/><text class="num" x="508" y="163.5" text-anchor="middle">2</text>
    <text class="h" x="500" y="205">Do the work</text>
    <text class="cmd" x="500" y="232">/build</text>
    <text class="body" x="500" y="268">runs the approved</text>
    <text class="body" x="500" y="288">plan, then calls</text>
    <text class="body" x="500" y="308">/review itself</text>
  </g>
  <path class="flow" d="M644 235H660" marker-end="url(#head)"/>
  <g>
    <rect class="card" x="664" y="130" width="160" height="210" rx="12"/>
    <circle class="lime" cx="690" cy="158" r="14"/><text class="num" x="690" y="163.5" text-anchor="middle">3</text>
    <text class="h" x="682" y="205">Quality-check</text>
    <text class="cmd" x="682" y="232">/review</text>
    <text class="body" x="682" y="268">re-runs each query,</text>
    <text class="body" x="682" y="288">walks the validation</text>
    <text class="body" x="682" y="308">pyramid to a verdict</text>
  </g>
  <path class="flow" d="M826 235H842" marker-end="url(#head)"/>
  <g>
    <rect class="card" x="846" y="130" width="148" height="210" rx="12"/>
    <circle class="lime" cx="872" cy="158" r="14"/><text class="num" x="872" y="163.5" text-anchor="middle">4</text>
    <text class="h" x="864" y="205">Deliver</text>
    <text class="cmd" x="864" y="232">/ship</text>
    <text class="body" x="864" y="268">backup, tracker</text>
    <text class="body" x="864" y="288">comment, commit</text>
    <text class="body" x="864" y="308">and pull request</text>
  </g>
  <path class="flow" d="M996 235H1012" marker-end="url(#head)"/>
  <g>
    <rect class="card" x="1016" y="130" width="144" height="210" rx="12"/>
    <circle class="lime" cx="1042" cy="158" r="14"/><text class="num" x="1042" y="163.5" text-anchor="middle">5</text>
    <text class="h" x="1034" y="205">Announce</text>
    <text class="cmd" x="1034" y="232">/ship</text>
    <text class="body" x="1034" y="268">a chat message</text>
    <text class="body" x="1034" y="288">for your team,</text>
    <text class="body" x="1034" y="308">drafted for you</text>
  </g>

  <!-- the person's three moments -->
  <rect class="you" x="300" y="356" width="160" height="30" rx="15"/>
  <text class="youtext" x="380" y="376" text-anchor="middle">you approve the plan</text>
  <rect class="you" x="664" y="356" width="160" height="30" rx="15"/>
  <text class="youtext" x="744" y="376" text-anchor="middle">you sign off</text>
  <rect class="you" x="846" y="356" width="314" height="30" rx="15"/>
  <text class="youtext" x="1003" y="376" text-anchor="middle">you say go ahead before anything is sent</text>

  <!-- shipped ticket feeds the brain -->
  <path class="loop" d="M920 388V448H135V346" marker-end="url(#head)"/>
  <rect x="368" y="436" width="364" height="26" fill="#030303"/>
  <text class="label" x="550" y="454" text-anchor="middle">files the ticket, its assumptions and its QC verdict</text>

  <!-- hooks -->
  <rect class="guard" x="40" y="500" width="1120" height="62" rx="12"/>
  <text class="h lime" x="64" y="538" style="font-size:17px">Hooks ask first</text>
  <text class="body" x="210" y="537" style="font-size:14.5px">destructive warehouse SQL  ·  a push with no approving review  ·  a raw transcript about to be committed or backed up</text>
</svg>

  <rect class="bg" width="1200" height="520"/>
  <rect class="grid" width="1200" height="520"/>

<!-- ============ recall.png ============
     The scores, reasons and verdict are what bin/recall.py printed on the fixture in
     scripts/readme_media/README.md ("The recall diagram's numbers"). Change the fixture, rerun it,
     and redraw them here; never type a score by hand. -->
<svg id="recall" class="diagram" xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <rect class="bg" width="1200" height="740"/>
  <rect class="grid" width="1200" height="740"/>
  <text class="kicker" x="40" y="52">HOW <tspan style="font-family:JetBrains Mono, Menlo, monospace">/ticket</tspan> FINDS PRIOR WORK: SCORED BY PLAIN CODE, READ BY THE MODEL</text>
  <image href="../../docs/images/logo-dark.svg" x="984" y="30" width="176" height="30"/>

  <!-- 1. every ticket folder becomes a card -->
  <rect class="brain" x="40" y="96" width="340" height="424" rx="14"/>
  <text class="h lime" x="60" y="134">Past tickets</text>
  <text class="body" x="60" y="158">each ticket folder becomes a card</text>
  <rect class="chip" x="60" y="174" width="300" height="58" rx="8"/>
  <text class="mono" x="76" y="198">tickets/bob/TEST-118/</text>
  <text class="mono" x="76" y="220" style="fill:#b8b8b8">README.md<tspan dx="18">q.sql</tspan></text>
  <path class="flow" d="M210 234V260" marker-end="url(#head)"/>
  <rect class="card" x="60" y="266" width="300" height="238" rx="10"/>
  <text class="body" x="78" y="292">The model writes the summary,</text>
  <text class="body" x="78" y="310">tags and links</text>
  <text class="mono" x="78" y="338" style="fill:#b8b8b8;font-size:12px">summary</text>
  <text class="chipt" x="150" y="338">Weekly returns rate baseline.</text>
  <text class="mono" x="78" y="362" style="fill:#b8b8b8;font-size:12px">tags</text>
  <text class="chipt" x="150" y="362">returns</text>
  <text class="mono" x="78" y="386" style="fill:#b8b8b8;font-size:12px">links</text>
  <text class="chipt" x="150" y="386">TEST-94</text>
  <path d="M78 404H342" stroke="#303030" stroke-width="1"/>
  <text class="body" x="78" y="428">A scan finds the tables in the SQL</text>
  <text class="mono" x="78" y="456" style="fill:#b8b8b8;font-size:12px">tables</text>
  <text class="chipt" x="150" y="456">analytics.returns</text>
  <text class="chipt" x="150" y="478">analytics.orders</text>

  <path class="flow" d="M382 246H406" marker-end="url(#head)"/>

  <!-- 2. the new ticket is scored against every card -->
  <rect class="card" x="412" y="96" width="290" height="300" rx="14"/>
  <text class="h" x="432" y="134">TEST-130 is scored</text>
  <text class="body" x="432" y="158">against every card, by plain code</text>
  <rect class="lime" x="432" y="180" width="50" height="28" rx="8"/><text class="num" x="457" y="199.5" text-anchor="middle">×4</text>
  <text class="label" x="496" y="199" style="font-size:15px">Tables <tspan style="fill:#b8b8b8;font-size:13px;font-weight:400">(rarer counts more)</tspan></text>
  <rect class="lime" x="432" y="222" width="50" height="28" rx="8"/><text class="num" x="457" y="241.5" text-anchor="middle">×3</text>
  <text class="label" x="496" y="241" style="font-size:15px">Tags</text>
  <rect class="lime" x="432" y="264" width="50" height="28" rx="8"/><text class="num" x="457" y="283.5" text-anchor="middle">+5</text>
  <text class="label" x="496" y="283" style="font-size:15px">Linked <tspan style="fill:#b8b8b8;font-size:13px;font-weight:400">(one names the other)</tspan></text>
  <rect class="lime" x="432" y="306" width="50" height="28" rx="8"/><text class="num" x="457" y="325.5" text-anchor="middle">×1</text>
  <text class="label" x="496" y="325" style="font-size:15px">Words <tspan style="fill:#b8b8b8;font-size:13px;font-weight:400">(up to 6)</tspan></text>
  <text class="body" x="432" y="370">Recency only breaks ties.</text>

  <path class="flow" d="M704 246H728" marker-end="url(#head)"/>

  <!-- 3. the ranked list, with the reasons and the verdict recall printed -->
  <rect class="card" x="734" y="96" width="426" height="300" rx="14"/>
  <text class="h" x="754" y="134">Ranked prior work</text>
  <text class="kicker" x="1140" y="134" text-anchor="end" style="font-size:12px">SCORE</text>
  <g>
    <text class="cmd" x="754" y="166">TEST-118</text>
    <text class="body" x="836" y="166">bob · Returns baseline</text>
    <text class="h lime" x="1140" y="167" text-anchor="end">9.0</text>
    <rect class="chip" x="754" y="176" width="163" height="24" rx="6"/>
    <text class="chipt" x="764" y="193"><tspan style="fill:#b8b8b8">table</tspan> analytics.returns</text>
    <rect class="chip" x="925" y="176" width="91" height="24" rx="6"/>
    <text class="chipt" x="935" y="193"><tspan style="fill:#b8b8b8">tag</tspan> returns</text>
    <rect class="chip" x="1024" y="176" width="69" height="24" rx="6"/>
    <text class="chipt" x="1034" y="193">2 words</text>
  </g>
  <g>
    <text class="cmd" x="754" y="230">TEST-127</text>
    <text class="body" x="836" y="230">alice · Region mapping</text>
    <text class="h" x="1140" y="231" text-anchor="end">4.0</text>
    <rect class="chip" x="754" y="240" width="124" height="24" rx="6"/>
    <text class="chipt" x="764" y="257"><tspan style="fill:#b8b8b8">tag</tspan> data-quality</text>
    <rect class="chip" x="886" y="240" width="60" height="24" rx="6"/>
    <text class="chipt" x="896" y="257">1 word</text>
  </g>
  <g>
    <text class="cmd" x="754" y="294">TEST-94</text>
    <text class="body" x="836" y="294">bob · Order volume weekly</text>
    <text class="h" x="1140" y="295" text-anchor="end">1.0</text>
    <rect class="chip" x="754" y="304" width="60" height="24" rx="6"/>
    <text class="chipt" x="764" y="321">1 word</text>
  </g>
  <rect x="754" y="342" width="297" height="30" rx="15" fill="rgba(196,255,0,.10)" stroke="#c4ff00" stroke-width="1.5"/>
  <text class="chipt" x="770" y="362"><tspan class="chiph">verdict: strong</tspan> · the top hit shares a table</text>

  <!-- the model reads the best few and writes the reuse brief -->
  <path class="flow" d="M770 398V422H557V446" marker-end="url(#head)"/>
  <rect class="card" x="412" y="452" width="290" height="188" rx="14"/>
  <text class="h" x="432" y="488">Reuse brief</text>
  <text class="body" x="432" y="514">The model reads the top 2 to 4</text>
  <text class="body" x="432" y="534">and writes the reuse brief:</text>
  <text class="label" x="432" y="566">· what to copy</text>
  <text class="label" x="432" y="590">· known gotchas</text>
  <text class="label" x="432" y="614">· what is different this time</text>
  <rect class="you" x="412" y="656" width="290" height="30" rx="15"/>
  <text class="youtext" x="557" y="676" text-anchor="middle">you approve the plan</text>

  <!-- the branch: older tickets from the tracker, only when recall is weak -->
  <path class="loop" d="M1000 398V446" marker-end="url(#head)"/>
