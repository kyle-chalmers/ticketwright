name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: Kit self-test (bash 3.2-safe, stdlib-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure yq
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      # Serial on purpose: this is the exact reference run, about a minute on Linux. The macOS job
      # below runs the sections in parallel (it is the slow one), so a serial full run is still
      # checked on every push and a parallel full run is too.
      - name: Self-test (config + adapters + hooks + index)
        run: bash bin/selftest.sh

      - name: Ticket index is in sync (staleness gate)
        run: python3 bin/build_ticket_index.py --check

  # ubuntu-latest ships a modern bash, so the job above cannot see a bash-3.2 regression — which is
  # exactly how selftest shipped unparseable on every stock Mac (heredocs inside $() desync 3.2's
  # scanner). macOS runners still ship 3.2.57 as /bin/bash: parse first for a crisp error, then run
  # the full suite under it, so the "bash 3.2-safe" promise in AGENTS.md is enforced, not asserted.
  selftest-macos-bash32:
    name: Kit self-test under stock macOS bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure yq
        run: |
          command -v yq >/dev/null 2>&1 || brew install yq
          yq --version

      - name: /bin/bash is really 3.2
        run: /bin/bash -c 'echo "$BASH_VERSION"; [ "${BASH_VERSINFO[0]}" -eq 3 ]'

      - name: Parse gate (bash 3.2)
        run: /bin/bash -n bin/selftest.sh

      # Serial, this job took about four minutes and set how long every push waited, while every
      # other job finished in about a minute. Every section as its own job, one per core: the same
      # checks as a serial run (section 85 compares the two on a sample), and a parallel run also
      # proves no section leans on another. --jobs itself runs under /bin/bash 3.2 here.
      - name: Full self-test (bash 3.2, sections in parallel)
        run: /bin/bash bin/selftest.sh --jobs "$(sysctl -n hw.ncpu)"

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned: this step executes the package and its lifecycle scripts on the runner. At least
      # 2.1.281, because older versions warn on plugin.json's directory listing fields (icon,
      # documentationUrl, supportUrl, privacyPolicyUrl), which fails --strict.
      - name: Install Claude Code CLI 2.1.296 (pinned)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.296
          installed="$(claude --version)"
          case "$installed" in
            2.1.296*) echo "claude $installed" ;;
            *) echo "::error::Expected claude 2.1.296, got '$installed'"; exit 1 ;;
          esac

      # Marketplace only. A root target resolves to marketplace.json in preference to
      # plugin.json, so this reads no skills, agents or hooks. Kept because it is the CLI's
      # own opinion of the marketplace schema, which selftest's greps cannot give us.
      - name: Marketplace manifest (strict)
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      # The manifest and its component paths: each must start ./, stay inside the plugin and exist.
      # This reads no skill or agent CONTENT: the validator only reads content in the default
      # skills/ and agents/ folders, and plugin.json points into .claude/ instead.
      - name: Plugin manifest (strict)
        run: claude plugin validate .claude-plugin/plugin.json --strict

      # The content the manifest points at. Pointed at a directory, the validator reads the
      # skills/, agents/ and commands/ inside it, which here is .claude/.
      - name: Skills + agents (strict)
        run: claude plugin validate .claude --strict

      # Negative control: proves the step above reads skill content. Without it, a regression
      # back to a content-blind target is indistinguishable from a passing gate.
      - name: "Negative control: corrupt skill must fail validation"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          # Named .claude like the gate's target: the validator reads a folder by its name.
          rsync -a --exclude 'worktrees/' --exclude 'settings.local.json' .claude/ "$tmp/.claude/"
          victim="$(find "$tmp/.claude/skills" -type f -name SKILL.md | sort | head -n 1)"
          test -f "$victim"
          cp tests/plugin-validate-negative/broken-SKILL.md "$victim"
          out="$tmp/validate.out"
          if claude plugin validate "$tmp/.claude" --strict >"$out" 2>&1; then
            echo "::error::Negative control PASSED. The gate is not reading skill content."
            cat "$out"; exit 1
          fi
          # A non-zero exit alone is not proof: an unrelated failure is also non-zero.
          if ! grep -qF "${victim#"$tmp"/.claude/}" "$out" || ! grep -qiE 'frontmatter|yaml' "$out"; then
            echo "::error::Validation failed for the wrong reason."
            cat "$out"; exit 1
          fi
          echo "Negative control OK."

  # The Claude plugin directory's own checks, on the tree it will read: the committed files at the
  # repo root, which is the plugin root. `git archive` gives exactly the tracked files, as GitHub
  # archives them, so nothing a local or CI run leaves behind is judged.
  # Docs: docs/maintainers/pypi-setup.md.
  plugin-directory:
    name: Plugin directory checks (--profile directory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned separately from plugin-validate: --profile first shipped in 2.1.305 (2026-10-20),
      # the oldest release that has it. Pinned because this executes the package on the runner.
      - name: Install Claude Code CLI 2.1.305 (pinned)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.305
          installed="$(claude --version)"
          case "$installed" in
            2.1.305*) echo "claude $installed" ;;
            *) echo "::error::Expected claude 2.1.305, got '$installed'"; exit 1 ;;
          esac

      - name: Directory profile on the committed tree (strict)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/tw"
          git archive HEAD | tar -x -C "$tmp/tw"
          out="$tmp/validate.out"
          rc=0; claude plugin validate --profile directory --strict "$tmp/tw" >"$out" 2>&1 || rc=$?
          cat "$out"
          # The root also holds marketplace.json. Prove the directory's rules ran on the plugin
          # rather than the folder being read as a marketplace only.
          if ! grep -qF "Plugin directory checks for" "$out"; then
            echo "::error::The directory profile did not run on the plugin."; exit 1
          fi
          exit "$rc"

      # Negative control: a symlinked component (the shape this repo used to ship) must fail.
      - name: "Negative control: a symlinked component must fail the profile"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir "$tmp/tw"
          git archive HEAD | tar -x -C "$tmp/tw"
          ln -s .claude/skills "$tmp/tw/skills"
          out="$tmp/validate.out"
          if claude plugin validate --profile directory --strict "$tmp/tw" >"$out" 2>&1; then
            echo "::error::Negative control PASSED. The profile does not see a symlinked component."
            cat "$out"; exit 1
          fi
          if ! grep -qi "symlink" "$out"; then
            echo "::error::Validation failed for the wrong reason."
            cat "$out"; exit 1
          fi
          echo "Negative control OK."

  # The publish workflow was the only place that ever ran `uv build`, so a broken wheel stayed
  # invisible until release day. Build and actually install it here instead — which, per this
  # file's `on:` block, means every PR and every push to main (not every push to any branch).
  wheel:
    name: Wheel builds, installs, and scaffolds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Install the wheel into a clean venv
        run: |
          python3 -m venv /tmp/tw
          /tmp/tw/bin/pip install --quiet dist/*.whl

      - name: CLI runs and reports the source-of-truth version
        run: |
          PKG="$(python3 -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('ticketwright/__init__.py').read_text())[1])")"
          OUT="$(/tmp/tw/bin/ticketwright --version)"
          echo "$OUT (expected $PKG)"
          test "$OUT" = "ticketwright $PKG" || { echo "::error::--version said '$OUT', expected 'ticketwright $PKG'"; exit 1; }
          /tmp/tw/bin/ticketwright --help > /dev/null

      - name: init scaffolds a fresh repo with the right contents
        run: |
          mkdir -p /tmp/fresh && cd /tmp/fresh
          /tmp/tw/bin/ticketwright init .
          fail=0
          for d in bin .claude/skills .claude/agents .claude/hooks adapters templates; do
            [ -d "$d" ] || { echo "::error::init did not scaffold $d"; fail=1; }
          done
          # the kit's own stack.yaml is a fictional "Acme" example — it must never land in a real repo
          if [ -e .claude/config/stack.yaml ]; then
            echo "::error::init wrote .claude/config/stack.yaml — the Acme example leaked into the wheel"; fail=1
          fi
          # ...but the schema + examples the user picks from must be there
          [ -f .claude/config/stack.schema.md ] || { echo "::error::stack.schema.md missing from the scaffold"; fail=1; }
          ls .claude/config/stack.example.*.yaml > /dev/null 2>&1 \
            || { echo "::error::no stack.example.*.yaml in the scaffold"; fail=1; }
          exit $fail

      # Deliberately sentinels a file the wheel DOES ship. Using stack.yaml here would pass
      # vacuously — it is excluded from the bundle, so init has no source to copy over it.
      - name: init re-runs without clobbering local edits, --force restores
        run: |
          cd /tmp/fresh
          echo "# local edit" >> .claude/config/stack.schema.md
          /tmp/tw/bin/ticketwright init .
          grep -q "# local edit" .claude/config/stack.schema.md \
            || { echo "::error::re-running init clobbered a locally edited file"; exit 1; }
          [ -e .claude/config/stack.yaml ] \
            && { echo "::error::re-running init created a stack.yaml"; exit 1; }
          /tmp/tw/bin/ticketwright init . --force
          grep -q "# local edit" .claude/config/stack.schema.md \
            && { echo "::error::--force did not restore the kit's copy"; exit 1; }
          echo "preserve-by-default and --force both behave"
