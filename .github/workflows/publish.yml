name: publish

# Tag a release (e.g. `git tag v1.3.1 && git push origin v1.3.1`) to build and publish to PyPI via
# Trusted Publishing (OIDC — no stored token). One-time setup (Part A): add a PyPI pending publisher
# for project `ticketwright`, owner kyle-chalmers, repo `ticketwright`, workflow `publish.yml`,
# environment `pypi`. See docs/maintainers/pypi-setup.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Verify the git tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Read the canonical version from the single source of truth (handles rc/post/dev cleanly).
          PKG="$(python3 -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('ticketwright/__init__.py').read_text())[1])")"
          echo "tag=$TAG version=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != ticketwright/__init__.py version $PKG — bump __init__.py to match the tag"; exit 1; }
          ls -l dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  directory-branch:
    # The Claude plugin directory listing follows the `directory` branch, not `main`, so a plugin
    # update reaches directory users only as a tagged release (main carries unreleased commits at
    # an unchanged version), and only after the same version is on PyPI. The branch carries the
    # release tree minus dev-only paths (tests, media tooling, CI, the self-test), which the
    # directory would otherwise hold for a reviewer on every version. directory_tree.sh builds that
    # commit with the current branch head as its only parent, so the push stays a fast-forward and
    # changes nothing under .github/ (which this token may not touch), and refuses a version that
    # is not higher than the listing's. The first trimmed commit is a one-time maintainer push
    # (`directory_tree.sh bootstrap`); until then this step fails loudly. pypi-setup.md, Part C.
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the `directory` branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit the trimmed release tree onto `directory`
        run: |
          set -euo pipefail
          # A prerelease tag (v4.3.0rc1) still publishes to PyPI, but must not reach the listing.
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::$GITHUB_REF_NAME is not a final release tag, so directory stays put."
            exit 0
          fi
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          base=""
          if git ls-remote --exit-code --heads origin directory >/dev/null; then
            git fetch -q origin "refs/heads/directory:refs/remotes/origin/directory"
            base="refs/remotes/origin/directory"
          fi
          # Run the script as the tag has it, so the trim list matches the release being listed.
          git show "${GITHUB_REF_NAME}:.github/scripts/directory_tree.sh" >"$RUNNER_TEMP/directory_tree.sh"
          commit="$(bash "$RUNNER_TEMP/directory_tree.sh" commit "$GITHUB_REF_NAME" $base)"
          echo "directory -> $commit (from $GITHUB_REF_NAME)"
          git push origin "${commit}:refs/heads/directory"
